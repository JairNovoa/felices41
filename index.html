<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Felicidades Beibicita 🥳!</title>
<style>
  :root{ color-scheme: dark; }
  html, body{
    margin:0; padding:0;
    width:100%; height:100%;
    height:100dvh;
    background:#000;
    overflow:hidden;
    -webkit-text-size-adjust:100%;
    font-family: 'Segoe UI', Verdana, Arial, sans-serif;
  }
  .slide{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    overflow:hidden;
    opacity:0;
    transform: scale(1.05);
    transition: opacity 1.6s ease-in-out, transform 10s linear;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .slide.active{
    opacity:1;
    transform: scale(1.0);
    z-index:2;
  }
  .slide.final{
    background: radial-gradient(ellipse at center, #1a1440 0%, #05030f 70%, #000000 100%);
    align-items:center;
  }
  .caption-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    padding: 0 5%;
    box-sizing:border-box;
    position:relative; z-index:2;
    margin-bottom: max(6%, calc(env(safe-area-inset-bottom, 0px) + 16px));
  }
  .slide.final .caption-wrap{ margin-bottom:0; }
  .caption{
    max-width: 900px;
    text-align:center;
    color:#ffffff;
    font-size: clamp(1.1rem, 2.6vw, 1.9rem);
    line-height:1.5;
    font-weight:600;
    box-sizing:border-box;
    max-height: 50vh; max-height: 50dvh;
    overflow-y:auto;
    padding: clamp(10px, 2vw, 18px) clamp(14px, 3vw, 28px);
    border-radius: 18px;
    background: rgba(0,0,0,0.45);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    text-shadow:
      0 0 8px rgba(0,0,0,0.9),
      0 0 18px rgba(0,0,0,0.7),
      0 2px 4px rgba(0,0,0,0.9);
    box-shadow: 0 0 40px rgba(0,0,0,0.3);
    white-space: pre-line;
    opacity:0;
    transform: translateY(20px);
    transition: opacity 1.4s ease 0.4s, transform 1.4s ease 0.4s;
  }
  .slide.active .caption{ opacity:1; transform: translateY(0); }
  .slide.final .caption{
    font-size: clamp(1.4rem, 3.4vw, 2.4rem);
    background: rgba(10,5,30,0.5);
  }
  .kiss{ display:inline-block; margin-left:8px; }
  .replay-btn{
    margin-top: 28px;
    display:inline-block;
    padding: 12px 28px;
    font-size: clamp(0.95rem, 1.8vw, 1.15rem);
    font-weight:600;
    color:#ffffff;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 999px;
    cursor:pointer;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    transition: background 0.25s ease, transform 0.2s ease;
  }
  .replay-btn:hover{ background: rgba(255,255,255,0.25); transform: translateY(-2px); }
  .replay-btn:active{ transform: translateY(0); }
  .final-inner{ display:flex; flex-direction:column; align-items:center; }
  canvas#fx{
    position:absolute; inset:0;
    width:100%; height:100%;
    z-index:5;
    pointer-events:none;
  }
  .stars-bg{ position:absolute; inset:0; z-index:0; background:#000; }

  /* Pantalla de inicio: el navegador solo deja sonar la música tras un toque */
  #start{
    position:absolute; inset:0; z-index:20;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:24px; text-align:center;
    padding: env(safe-area-inset-top, 0px) 6% env(safe-area-inset-bottom, 0px);
    box-sizing:border-box;
    background: radial-gradient(ellipse at center, #1a1440 0%, #05030f 70%, #000 100%);
    color:#fff; cursor:pointer;
    transition: opacity 0.8s ease;
  }
  #start.hide{ opacity:0; pointer-events:none; }
  #start h1{ margin:0; font-size: clamp(1.6rem, 5vw, 3rem); }
  #start p{ margin:0; font-size: clamp(1rem, 2.4vw, 1.4rem); opacity:0.85; }

  /* Foto: fondo difuminado + imagen encima (sin recortes raros en ningún tamaño) */
  .slide:not(.final)::before{
    content:"";
    position:absolute; inset:-6%;
    background: var(--img) center / cover no-repeat;
    filter: blur(28px) brightness(0.55);
    z-index:0;
  }
  .photo{
    position:absolute; inset:0; z-index:1;
    background-image: var(--img);
    background-position:center;
    background-repeat:no-repeat;
    background-size: cover;
  }
  /* Celular en vertical: la foto completa, sin recortar */
  @media (orientation: portrait){
    .photo{ background-size: contain; }
  }

  /* Pantallas pequeñas */
  @media (max-width: 480px){
    .caption{ border-radius:14px; line-height:1.4; }
    .replay-btn{ padding:12px 24px; }
  }
  /* Celular en horizontal (poca altura) */
  @media (max-height: 500px){
    .caption-wrap{ margin-bottom: 4%; }
    .caption{ font-size: clamp(0.9rem, 2.2vw, 1.2rem); padding:8px 16px; max-height:40dvh; }
    .slide.final .caption{ font-size: clamp(1.1rem, 3vw, 1.6rem); }
    .replay-btn{ margin-top:14px; padding:8px 20px; }
    #start{ gap:12px; }
  }
  /* Pantallas grandes */
  @media (min-width: 1400px){
    .caption{ max-width:1100px; }
  }
  @media (prefers-reduced-motion: reduce){
    .slide{ transition: opacity 1.6s ease-in-out; transform:none; }
    .slide.active{ transform:none; }
  }
</style>
</head>
<body>

<div class="stars-bg"></div>

<!-- Las mañanitas: guarda el audio como mananitas.mp3 dentro de la carpeta audio -->
<audio id="music" src="audio/mananitas.mp3" loop preload="auto"></audio>

<div id="start">
  <h1>¡Que los cumplas feliz 😘!</h1>
  <p>Toca la pantalla para comenzar 🎶</p>
</div>

<div id="slides"></div>

<canvas id="fx"></canvas>

<script>
(function(){
  // ============================================================
  // EDITA AQUÍ: las 17 imágenes y sus leyendas (en orden).
  // Deja la leyenda vacía ("") si una foto no lleva texto.
  // ============================================================
  const IMG_DIR = 'imagenes/'; // carpeta donde están las fotos
  const PHOTOS = [
    { img: 'gabyta01.jpg', text: '' },
    { img: 'gabyta02.jpg', text: '' },
    { img: 'gabyta03.jpg', text: '' },
    { img: 'gabyta04.jpg', text: '' },
    { img: 'gabyta06.jpg', text: '' },
    { img: 'gabyta07.jpg', text: '' },
    { img: 'gabyta08.jpg', text: '' },
    { img: 'gabyta09.jpg', text: '' },
    { img: 'gabyta10.jpg', text: '' },
    { img: 'gabyta11.jpg', text: '' },
    { img: 'gabyta12.jpg', text: '' },
    { img: 'gabyta13.jpg', text: '' },
    { img: 'gabyta14.jpg', text: '' },
    { img: 'gabyta16.jpg', text: '' },
    { img: 'gabyta17.jpg', text: '' }
  ];
  const FINAL_TEXT = '¡Feliz cumpleaños Beibicita 🥳!\n\n¡Te amo ❤️!';
  const INTERVAL = 12500; // milisegundos por imagen
  // ============================================================

  const container = document.getElementById('slides');
  PHOTOS.forEach((p, i) => {
    const s = document.createElement('div');
    s.className = 'slide';
    s.id = 'slide' + i;
    s.style.setProperty('--img', "url('" + IMG_DIR + p.img + "')");
    const ph = document.createElement('div');
    ph.className = 'photo';
    s.appendChild(ph);
    if (p.text) {
      s.insertAdjacentHTML('beforeend', '<div class="caption-wrap"><div class="caption"></div></div>');
      s.querySelector('.caption').textContent = p.text;
    }
    container.appendChild(s);
  });
  const fin = document.createElement('div');
  fin.className = 'slide final';
  fin.id = 'slideFinal';
  fin.innerHTML =
    '<div class="caption-wrap"><div class="final-inner">' +
    '<div class="caption"><span class="txt"></span><br><span class="kiss">😘</span></div>' +
    '<button class="replay-btn" id="replayBtn">Ver otra vez ✨</button>' +
    '</div></div>';
  fin.querySelector('.txt').textContent = FINAL_TEXT;
  container.appendChild(fin);

  const slides = Array.from(document.querySelectorAll('.slide'));
  const total = slides.length;
  let current = 0;
  let timer = null;
  const music = document.getElementById('music');
  const startScreen = document.getElementById('start');

  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const colors = ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff924c','#f15bb5','#00f5d4'];

  function spawnFirework(cx, cy){
    const particles = [];
    const count = 90 + Math.floor(Math.random()*40);
    for(let i=0;i<count;i++){
      const angle = (Math.PI*2*i)/count + Math.random()*0.2;
      const speed = 1.5 + Math.random()*5.5;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        life: 1,
        color: colors[Math.floor(Math.random()*colors.length)],
        size: 1.8 + Math.random()*2.6
      });
    }
    return particles;
  }

  let allParticles = [];
  let animating = false;

  // Más estallidos por imagen; en el mensaje final, un gran espectáculo
  function triggerFireworkBurst(bursts){
    bursts = bursts || 9;
    allParticles = [];
    for(let b=0; b<bursts; b++){
      setTimeout(()=>{
        const cx = canvas.width * (0.1 + Math.random()*0.8);
        const cy = canvas.height * (0.12 + Math.random()*0.5);
        allParticles = allParticles.concat(spawnFirework(cx, cy));
        if(!animating){ animating = true; requestAnimationFrame(animate); }
      }, b*260);
    }
  }

  function animate(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'lighter';
    let alive = false;
    allParticles.forEach(p=>{
      if(p.life <= 0) return;
      alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.03;
      p.life -= 0.014;
      ctx.beginPath();
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if(alive){
      requestAnimationFrame(animate);
    } else {
      animating = false;
      allParticles = [];
    }
  }

  // Avanza y programa el siguiente solo si aún no llegamos al final.
  function nextSlide(){
    const prev = current;
    current = current + 1;
    triggerFireworkBurst(current === total - 1 ? 22 : 9);
    slides[prev].classList.remove('active');
    slides[current].classList.add('active');
    if(current < total - 1){
      timer = setTimeout(nextSlide, INTERVAL);
    }
  }

  function begin(){
    slides.forEach(s => s.classList.remove('active'));
    current = 0;
    slides[0].classList.add('active');
    if(timer) clearTimeout(timer);
    timer = setTimeout(nextSlide, INTERVAL);
  }

  function playMusic(){
    try{
      music.currentTime = 0;
      const pr = music.play();
      if(pr && pr.catch) pr.catch(()=>{});
    }catch(e){}
  }

  startScreen.addEventListener('click', function(){
    startScreen.classList.add('hide');
    triggerFireworkBurst(12);
    playMusic();
    begin();
  });

  document.getElementById('replayBtn').addEventListener('click', function(){
    triggerFireworkBurst(12);
    playMusic();
    begin();
  });
})();
</script>

</body>
</html>
